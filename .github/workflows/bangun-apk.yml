name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests, debug APK and release lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code (No submodules needed)
        uses: actions/checkout@v4
        # Hapus 'submodules: recursive' karena Humla sekarang folder biasa
      
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-license: true
      
      - name: Install pinned NDK & Build Tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;25.1.8937393"
      
      # PERBAIKAN: Build Spongy Castle langsung dari folder lokal
      # Tidak perlu path '../../gradlew' lagi karena struktur folder sudah flat
      - name: Build patched Spongy Castle jars
        working-directory: libraries/humla/libs/humla-spongycastle
        run: |
          chmod +x ./gradlew
          ./gradlew jar --no-daemon
      
      - name: Test and assemble FOSS debug and unsigned release
        run: |
          chmod +x gradlew
          ./gradlew :app:testFossDebugUnitTest :app:assembleFossDebug :app:assembleFossRelease --no-daemon --stacktrace
      
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mumla-foss-debug-${{ github.sha }}
          path: app/build/outputs/apk/foss/debug/mumla-foss-debug.apk
          if-no-files-found: error
          retention-days: 14

  web:
    name: Portal tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
        
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Test
        run: pnpm test
      
      - name: Type-check
        run: pnpm exec tsc --noEmit
      
      - name: Build
        run: pnpm build
